apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/akkineninagarjuna01/product-service-gitops.git
    targetRevision: main
    path: helm/product-service

  destination:
    server: https://kubernetes.default.svc
    namespace: product

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
